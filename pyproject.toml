[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fileconv*"]
exclude = ["source*", "tests*"]

[tool.setuptools.package-data]
fileconv = ["py.typed"]

[project]
name = "grubber-fileconv"
version = "1.5.0"
description = "Extensible local file converter with plugin registry (LibreOffice, pdf2docx, Pillow)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gibson", email = "mwasgibson@users.noreply.github.com" }]
keywords = ["converter", "cli", "libreoffice", "pdf", "docx", "images"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "python-magic>=0.4.27",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "pdf2docx>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
fileconv = "fileconv.cli:app"

[project.urls]
Homepage = "https://github.com/mwasgibson/grubber"
Repository = "https://github.com/mwasgibson/grubber"
Issues = "https://github.com/mwasgibson/grubber/issues"
Changelog = "https://github.com/mwasgibson/grubber/blob/main/CHANGELOG.md"

[project.entry-points."fileconv.converters"]
libreoffice = "fileconv.converters.libreoffice:LibreOfficeConverter"
pdf2docx = "fileconv.converters.pdf2docx:Pdf2DocxConverter"
pillow = "fileconv.converters.image:PillowImageConverter"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
