[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileconv"
version = "0.1.0"
description = "Extensible local file converter with plugin registry"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "python-magic>=0.4.27",
  "Pillow>=10.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
test = [
  "pytest>=8.0"
]

[project.scripts]
fileconv = "fileconv.cli:app"

[project.urls]
Homepage = "https://github.com/mwasgibson/grubber"

[tool.setuptools]
include-package-data = true

[tool.pyproject]
# LibreOffice is required as a system dependency for the built-in document converter.
# Install it with your package manager, for example: sudo apt-get install -y libreoffice

[project.entry-points."fileconv.converters"]
libreoffice = "fileconv.converters.libreoffice:LibreOfficeConverter"
